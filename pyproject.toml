[project]
name = "odorography"
version = "0.1.0"
description = "Tracking Dancers on the Floor"
authors = [
    {name = "Ringoftheking"}
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "ultralytics (>=8.4.41,<9.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
